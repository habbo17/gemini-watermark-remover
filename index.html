<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Remove Gemini watermarks locally - 100% private, instant processing">
    <title>domara - Gemini Watermark Remover</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">domara</h1>
            <p class="subtitle">
                Gemini watermark remover &mdash; local &bull; instant &bull; pixel-perfect
            </p>
        </header>

        <div class="drop-zone" id="dropZone">
            <span class="drop-icon">&darr;</span>
            <p class="drop-text">
                Drop image here<br>
                <span class="drop-subtext">or click to browse</span>
            </p>
            <input type="file" id="fileInput" accept="image/*" aria-label="Select image file">
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="log-area" id="logArea"></div>

        <div class="result-area" id="resultArea">
            <h2 class="result-title">Clean</h2>

            <div class="preview-container">
                <img id="previewImg" class="preview-img" alt="Processed image">
            </div>

            <div class="comparison-container" id="comparisonContainer"></div>

            <div class="action-buttons">
                <a id="downloadLink" class="btn btn-primary" download>
                    Download
                </a>
                <button id="resetBtn" class="btn btn-secondary">
                    Process Another
                </button>
            </div>
        </div>

        <footer class="footer">
            <p class="footer-note">
                Processed entirely in your browser. Nothing leaves your machine.
            </p>
        </footer>
    </div>

    <script type="module" src="src/js/app.js"></script>
</body>
</html>
